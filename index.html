*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:#050916;color:white;font-family:ui-rounded,'Hiragino Maru Gothic ProN','Arial Rounded MT Bold',system-ui,sans-serif}#app{position:relative;height:100dvh;width:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#152d4b 0%,#060c1c 78%)}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:absolute;top:max(8px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-size:12px;letter-spacing:.4px;text-shadow:0 1px 6px #000}#hud strong{display:block;font-size:26px;color:#fff;font-variant-numeric:tabular-nums}#count{color:#7cf3ff;font-weight:800}#hud button{pointer-events:auto;padding:9px 11px;font-size:13px}button{border:1px solid #47dff8;background:linear-gradient(140deg,#184661,#10263e);border-radius:13px;color:#fff;padding:12px 16px;font-size:16px;font-weight:800;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.98)}.overlay{position:absolute;inset:0;background:#030b1bea;display:flex;justify-content:center;align-items:center;padding:14px}.panel{width:min(390px,100%);max-height:93%;overflow-y:auto;overscroll-behavior:contain;border:1px solid #51e4ff;border-radius:22px;background:linear-gradient(155deg,#132f49,#0b152b);box-shadow:0 0 30px #14b6ee33;padding:19px;display:grid;gap:11px;text-align:center}.panel h1{font-size:clamp(34px,9vw,46px);margin:3px 0;line-height:1.12;color:#fff;text-shadow:2px 3px #ff4acb,0 0 22px #31d9ff;letter-spacing:2px}.panel h2{margin:0 0 3px;font-size:25px}.panel p{margin:3px 0;font-size:13px;line-height:1.5;color:#d5ecf8}.sub{font-size:11px;letter-spacing:3px;color:#81f1ff}.hidden{display:none!important}.rule{display:flex;align-items:center;text-align:left;gap:10px;font-size:12px;line-height:1.45}.rule b{display:block;font-size:14px;color:#fff;margin-bottom:2px}.rule .art{flex:none;width:66px;min-height:53px;display:g </style></head><body><div id="app"><canvas id="game"></canvas><div id="hud" class="hidden"><div>SCORE<strong id="score">0</strong><span id="count">惑星数 0 / 20</span></div><button id="pause">Ⅱ 一時停止</button></div><div id="hint" class="hidden">惑星を引っぱって、はなそう！</div><div id="power" class="hidden"></div><div id="flash"></div><div id="title" class="overlay"><div class="panel"><div class="sub">NEON PLANET MERGE</div><h1>コスモ<br>ポップ！</h1><p>惑星を弾いて、くっつけて、太陽をつくろう！</p><button id="start">ゲームスタート 🚀</button><button id="how">あそびかた 🌟</button><button id="sound">サウンド設定 ♪</button><p id="best">BEST 0</p></div></div><div id="modal" class="overlay hidden"><div id="modalBody" class="panel"></div></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,balls=[],loaded=null,aim=null,score=0,best=0,state='title',last=0,frame=0,waiting=0,particles=[],rings=[],labels=[],special=0,sfx=true,audio=null,nextId=1,launching=false,flashTimeout=0;const names=['水星','火星','金星','地球','海王星','天王星','土星','木星','太陽'],colors=['#aebbc9','#f47a4d','#f5d27b','#39a9ff','#357aff','#91edf4','#e9c992','#dca36c','#fff2a2'],diam=[4879,6779,12104,12742,49244,50724,116460,139820,1392700],mass=[.0553,.107,.815,1,17.15,14.54,95.16,317.8,333000],points=[0,0,100,200,400,700,1100,1700,2500,4000],BLACK=0,MAX=20;try{best=Number(localStorage.getItem('cosmo-pop-best')||localStorage.getItem('curling-merge-best')||0)}catch(e){}const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));function radius(l){if(l===0)return 17*Math.min(1,W/375);return (9+4.1*Math.pow(diam[l-1]/4879,.31))*Math.min(1,W/375)}function effectiveMass(l){return l===0?4:1+.85*Math.log1p(mass[l-1])}function bounds(y){let t=clamp((y-top())/(bottom()-top()),0,1);return {left:W*(.23-.15*t),right:W*(.77+.15*t)}}function top(){return Math.max(100,H*.17)}function bottom(){return H-Math.max(68,H*.09)}function startY(){return bottom()-Math.max(88,H*.19)}function spawnLevel(){return Math.random()<.018?BLACK:1+Math.floor(Math.random()*4)}function fit(){let ow=W,oh=H;W=canvas.clientWidth;H=canvas.clientHeight;dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(ow&&oh&&(ow!==W||oh!==H)){let sx=W/ow,sy=H/oh;for(const b of balls){b.x*=sx;b.y*=sy}if(loaded){loaded.x=W/2;loaded.y=startY()}}draw()}window.addEventListener('resize',fit);
function audioReady(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}function beep(freq,duration=.12,type='sine',gain=.09,delay=0){if(!sfx||!audio)return;try{let t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(80,freq*.78),t+duration);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+duration+.01)}catch(e){}}function sound(kind,l=1){if(kind==='shoot')beep(410,.13,'triangle',.075);if(kind==='hit')beep(260,.055,'sine',.025);if(kind==='merge'){let f=370+l*48;beep(f,.11,'sine',.1);beep(f*1.28,.16,'triangle',.075,.085);if(l>=6)beep(f*1.6,.24,'sine',.07,.17)}if(kind==='nova'){[370,470,600,790,1050,1360].forEach((f,i)=>beep(f,.55,'triangle',.11,i*.12));beep(180,.9,'sawtooth',.07)}if(kind==='black'){beep(290,.36,'sawtooth',.075);beep(150,.45,'sine',.1,.08)}}
function addStar(x,y,col,count,size=3,duration=.65){for(let i=0;i<count;i++){let a=rnd(0,Math.PI*2),v=rnd(65,190)*(1+size/12);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:duration*rnd(.65,1.25),max:duration,size:rnd(1.5,size),color:col,rot:rnd(0,6.3),spin:rnd(-8,8),star:Math.random()<.65})}}function ring(x,y,color,life=.55,r=12,max=65){rings.push({x,y,color,life,maxLife:life,r,max})}function label(x,y,text,col,l=1){labels.push({x,y,text,color:col,life:.95,max:.95,size:clamp(17+l*1.2,18,29)})}function popup(text){let el=$('flash');el.textContent=text;el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}
function newBall(l,x,y){return{id:nextId++,l,x,y,vx:0,vy:0,r:radius(l),m:effectiveMass(l),hitCooldown:0}}function newLoaded(){if(state!=='playing'||loaded)return;loaded=newBall(spawnLevel(),W/2,startY());launching=false;draw()}function start(){cancelAnimationFrame(frame);balls=[];particles=[];rings=[];labels=[];loaded=null;aim=null;waiting=0;score=0;nextId=1;special=0;state='playing';$('title').classList.add('hidden');$('modal').classList.add('hidden');$('hud').classList.remove('hidden');$('hint').classList.remove('hidden');$('power').classList.add('hidden');updateHUD();newLoaded();last=performance.now();frame=requestAnimationFrame(loop)}function updateHUD(){$('score').textContent=score.toLocaleString('ja-JP');$('count').textContent='惑星数 '+(balls.length+(loaded?1:0))+' / '+MAX}function isMoving(){return balls.some(b=>Math.hypot(b.vx,b.vy)>6)}function gameOver(){if(state!=='playing')return;state='over';cancelAnimationFrame(frame);loaded=null;$('hud').classList.add('hidden');$('hint').classList.add('hidden');$('power').classList.add('hidden');let record=score>best;if(record){best=score;try{localStorage.setItem('cosmo-pop-best',String(best))}catch(e){}}modal(`<h2>ゲームオーバー</h2>${record?'<div style="color:#75f7ff;font-weight:900">🎉 ベスト更新！</div>':''}<div>最終スコア</div><div style="font-size:36px;font-weight:900;color:#83f3ff">${score.toLocaleString('ja-JP')}</div><p>BEST ${best.toLocaleString('ja-JP')}</p><button id="again">もう一度あそぶ</button><button id="back">タイトルへ</button>`);$('again').onclick=start;$('back').onclick=title}function title(){state='title';cancelAnimationFrame(frame);balls=[];loaded=null;aim=null;$('title').classList.remove('hidden');$('modal').classList.add('hidden');$('hud').classList.add('hidden');$('hint').classList.add('hidden');$('power').classList.add('hidden');$('best').textContent='BEST '+best.toLocaleString('ja-JP');draw()}function modal(html){$('modalBody').innerHTML=html;$('modal').classList.remove('hidden')}function pause(){if(state!=='playing')return;state='paused';cancelAnimationFrame(frame);modal('<h2>一時停止</h2><button id="resume">ゲームを続ける</button><button id="leave">タイトルへ戻る</button>');$('resume').onclick=resume;$('leave').onclick=()=>{modal('<h2>タイトルに戻る？</h2><button id="stay">ゲームを続ける</button><button id="quit">タイトルへ戻る</button>');$('stay').onclick=resume;$('quit').onclick=title}}function resume(){state='playing';$('modal').classList.add('hidden');last=performance.now();frame=requestAnimationFrame(loop)}
function absorb(bh,planet){let x=(bh.x+planet.x)/2,y=(bh.y+planet.y)/2,penalty=points[planet.l]*3;score-=penalty;balls=balls.filter(b=>b!==bh&&b!==planet);addStar(x,y,'#a456ff',22,5,.8);ring(x,y,'#b779ff',.7,10,85);label(x,y,'−'+penalty.toLocaleString('ja-JP'),'#e5adff',5);sound('black');updateHUD()}function merge(a,b){let l=a.l,x=(a.x+b.x)/2,y=(a.y+b.y)/2;balls=balls.filter(q=>q!==a&&q!==b);if(l===9){score+=20000;special=2.6;addStar(x,y,'#ffe28c',115,11,2.3);addStar(x,y,'#fff',48,6,2.2);for(let i=0;i<4;i++)ring(x,y,i%2?'#fff5be':'#ffb342',1.3+i*.27,8,Math.min(W*.8,130+i*47));popup('☀ 太陽 NOVA！ +20,000');sound('nova')}else{let n=l+1,c=colors[n-1];let child=newBall(n,x,y);child.vx=(a.vx+b.vx)*.12;child.vy=(a.vy+b.vy)*.12;balls.push(child);score+=points[n];let cnt=6+n*5,sz=2+n*.8;addStar(x,y,c,cnt,sz,.43+n*.055);ring(x,y,c,.35+n*.04,8,28+n*7);label(x,y,names[n-1]+'！',c,n);sound('merge',n);if(n===9){addStar(x,y,'#fff2a2',55,8,1.1);ring(x,y,'#ffd878',1.1,15,135);popup('☀ 太陽 誕生！')}}updateHUD()}
function collide(a,b){let dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.001,min=a.r+b.r;if(dist>=min)return false;let nx=dx/dist,ny=dy/dist;if(a.l===0||b.l===0){if(a.l===0&&b.l===0){let overlap=min-dist;a.x-=nx*overlap/2;b.x+=nx*overlap/2;return true}absorb(a.l===0?a:b,a.l===0?b:a);return true}if(a.l===b.l){merge(a,b);return true}let overlap=min-dist,ma=a.m,mb=b.m,total=ma+mb;a.x-=nx*overlap*(mb/total);a.y-=ny*overlap*(mb/total);b.x+=nx*overlap*(ma/total);b.y+=ny*overlap*(ma/total);let rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){let impulse=-(1+.54)*rel/(1/ma+1/mb);a.vx-=impulse*nx/ma;a.vy-=impulse*ny/ma;b.vx+=impulse*nx/mb;b.vy+=impulse*ny/mb;if(Math.abs(rel)>55&&Math.random()<.2)sound('hit')}return false}
function step(dt){for(const b of balls){let v=Math.hypot(b.vx,b.vy);let drag=1.24+b.l*.027+(v<80?2.3:0);let factor=Math.exp(-drag*dt);b.vx*=factor;b.vy*=factor;if(Math.hypot(b.vx,b.vy)<6){b.vx=0;b.vy=0}b.x+=b.vx*dt;b.y+=b.vy*dt;let yy=clamp(b.y,top(),bottom()),bb=bounds(yy);if(b.x-b.r<bb.left){b.x=bb.left+b.r;b.vx=Math.abs(b.vx)*.58}if(b.x+b.r>bb.right){b.x=bb.right-b.r;b.vx=-Math.abs(b.vx)*.58}if(b.y-b.r<top()){b.y=top()+b.r;b.vy=Math.abs(b.vy)*.58}if(b.y+b.r>bottom()){b.y=bottom()-b.r;b.vy=-Math.abs(b.vy)*.58}}for(let i=0;i<balls.length;i++){let restart=false;for(let j=i+1;j<balls.length;j++){let a=balls[i],b=balls[j];if(Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r){let old=balls.length;collide(a,b);if(balls.length!==old){restart=true;break}}}if(restart){i=-1;continue}}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.exp(-2*dt);p.vy*=Math.exp(-2*dt);p.rot+=p.spin*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);for(const r of rings)r.life-=dt;rings=rings.filter(r=>r.life>0);for(const l of labels){l.life-=dt;l.y-=18*dt}labels=labels.filter(l=>l.life>0);if(special>0)special-=dt}
function loop(now){if(state!=='playing')return;let dt=clamp((now-last)/1000,0,.034);last=now;step(dt/2);step(dt/2);if(balls.length+(loaded?1:0)>=MAX){gameOver();return}if(!loaded){if(isMoving()){waiting=0}else{waiting+=dt;if(waiting>.22){balls.forEach(b=>{b.vx=0;b.vy=0});newLoaded();waiting=0}}}updateHUD();draw();frame=requestAnimationFrame(loop)}
function pathStar(x,y,outer,inner,rot=0){ctx.beginPath();for(let i=0;i<10;i++){let a=rot+i*Math.PI/5-Math.PI/2,r=i%2?inner:outer;let px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.closePath()}function ballArt(b){let {x,y,r,l}=b;ctx.save();ctx.translate(x,y);if(l===0){ctx.shadowColor='#b45dff';ctx.shadowBlur=22;let g=ctx.createRadialGradient(-r*.2,-r*.25,1,0,0,r);g.addColorStop(0,'#351f63');g.addColorStop(.5,'#100c24');g.addColorStop(1,'#000008');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*.85,0,7);ctx.fill();ctx.strokeStyle='#b763ff';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,r*1.24,r*.44,-.4,0,7);ctx.stroke();ctx.strokeStyle='#67f5ff';ctx.lineWidth=1.4;ctx.beginPath();ctx.ellipse(0,0,r*1.34,r*.51,-.4,0,7);ctx.stroke();ctx.restore();return}let c=colors[l-1];ctx.shadowColor=c;ctx.shadowBlur=l===9?25:12;let g=ctx.createRadialGradient(-r*.32,-r*.36,1,0,0,r);g.addColorStop(0,'#ffffff');g.addColorStop(.16,c);g.addColorStop(.72,c);g.addColorStop(1,'#07162b');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.shadowBlur=0;ctx.save();ctx.beginPath();ctx.arc(0,0,r*.94,0,7);ctx.clip();if(l===1||l===2){ctx.fillStyle=l===1?'#738092':'#9c4b37';for(let i=0;i<5;i++){let px=Math.sin(i*8.9)*r*.66,py=Math.cos(i*6.3)*r*.66;ctx.beginPath();ctx.arc(px,py,r*(.07+i*.016),0,7);ctx.fill()}}else if(l===3||l===5||l===6||l===8){ctx.globalAlpha=.5;ctx.strokeStyle=l===8?'#7a503d':'#fff';ctx.lineWidth=r*.12;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(-r,i*r*.3);ctx.bezierCurveTo(-r*.3,i*r*.25,r*.3,i*r*.45,r,i*r*.3);ctx.stroke()}if(l===8){ctx.fillStyle='#b45c42';ctx.beginPath();ctx.ellipse(r*.3,r*.22,r*.19,r*.11,-.2,0,7);ctx.fill()}}else if(l===4){ctx.fillStyle='#16884b';for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(Math.sin(i*3)*r*.48,Math.cos(i*4)*r*.38,r*.32,r*.17,i,0,7);ctx.fill()}ctx.strokeStyle='#eafaff';ctx.lineWidth=r*.09;ctx.beginPath();ctx.arc(-r*.2,-r*.1,r*.66,.4,2.9);ctx.stroke()}if(l===9){ctx.strokeStyle='#fff4b0';ctx.lineWidth=2;for(let i=0;i<8;i++){let a=i*Math.PI/4;ctx.beginPath();ctx.arc(Math.cos(a)*r*.55,Math.sin(a)*r*.55,r*.3,0,Math.PI);ctx.stroke()}}ctx.restore();if(l===7){ctx.strokeStyle='#e9dfc3';ctx.lineWidth=r*.18;ctx.beginPath();ctx.ellipse(0,0,r*1.55,r*.45,-.25,0,7);ctx.stroke();ctx.strokeStyle='#a8effa';ctx.lineWidth=1;ctx.stroke()}ctx.strokeStyle='#ffffff99';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,r*.98,0,7);ctx.stroke();ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0d2138');bg.addColorStop(.7,'#081327');bg.addColorStop(1,'#030918');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(let i=0;i<65;i++){let x=((i*89.31)%W),y=((i*127.73)%H);ctx.fillStyle=i%4?'#91b9dd55':'#ffffff99';ctx.fillRect(x,y,i%6?1:2,i%6?1:2)}let a=bounds(top()),b=bounds(bottom());ctx.beginPath();ctx.moveTo(a.left,top());ctx.lineTo(a.right,top());ctx.lineTo(b.right,bottom());ctx.lineTo(b.left,bottom());ctx.closePath();ctx.fillStyle='#0a2033bb';ctx.fill();ctx.strokeStyle='#52edff';ctx.shadowColor='#35dfff';ctx.shadowBlur=15;ctx.lineWidth=3;ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='#24537255';ctx.lineWidth=1;for(let i=1;i<8;i++){let y=top()+(bottom()-top())*i/8,bb=bounds(y);ctx.beginPath();ctx.moveTo(bb.left,y);ctx.lineTo(bb.right,y);ctx.stroke()}for(const b of balls)ballArt(b);if(loaded)ballArt(loaded);if(aim&&loaded){let dx=loaded.x-aim.x,dy=loaded.y-aim.y,len=Math.hypot(dx,dy),p=clamp(len/125,0,1),ang=Math.atan2(dy,dx);ctx.strokeStyle='#8dfdff';ctx.lineWidth=2;ctx.shadowColor='#40edff';ctx.shadowBlur=9;ctx.beginPath();ctx.moveTo(loaded.x,loaded.y);ctx.lineTo(loaded.x+Math.cos(ang)*(40+p*85),loaded.y+Math.sin(ang)*(40+p*85));ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='#ff9cf7';ctx.beginPath();ctx.moveTo(loaded.x,loaded.y);ctx.lineTo(aim.x,aim.y);ctx.stroke()}for(const r of rings){let t=1-r.life/r.maxLife;ctx.save();ctx.globalAlpha=(1-t)*.9;ctx.strokeStyle=r.color;ctx.lineWidth=3*(1-t)+.5;ctx.shadowColor=r.color;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(r.x,r.y,r.r+(r.max-r.r)*t,0,7);ctx.stroke();ctx.restore()}for(const p of particles){ctx.save();ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=9; if(p.star){pathStar(p.x,p.y,p.size,p.size*.45,p.rot);ctx.fill()}else{ctx.beginPath();ctx.arc(p.x,p.y,p.size*.5,0,7);ctx.fill()}ctx.restore()}for(const l of labels){let t=1-l.life/l.max,scale=t<.2?.65+t*2.5:t<.35?1.16-(t-.2)*1.05:1;ctx.save();ctx.translate(l.x,l.y);ctx.scale(scale,scale);ctx.globalAlpha=clamp(l.life/.25,0,1);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`1000 ${l.size}px ui-rounded,'Hiragino Maru Gothic ProN',system-ui,sans-serif`;ctx.lineJoin='round';ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=6;ctx.strokeText(l.text,0,0);ctx.shadowBlur=0;ctx.fillStyle=l.color;ctx.fillText(l.text,0,0);ctx.restore()}}
function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.addEventListener('pointerdown',e=>{if(state!=='playing'||!loaded||aim)return;let p=pos(e);if(Math.hypot(p.x-loaded.x,p.y-loaded.y)>Math.max(55,loaded.r*2.7))return;audioReady();aim=p;canvas.setPointerCapture(e.pointerId);$('power').classList.remove('hidden');$('power').textContent='POWER 0%';draw()});canvas.addEventListener('pointermove',e=>{if(!aim||!loaded)return;aim=pos(e);let power=clamp(Math.hypot(loaded.x-aim.x,loaded.y-aim.y)/125,0,1);$('power').textContent='POWER '+Math.round(power*100)+'%';draw()});function release(e){if(!aim||!loaded)return;let p=pos(e),dx=loaded.x-p.x,dy=loaded.y-p.y,len=Math.hypot(dx,dy);aim=null;$('power').classList.add('hidden');if(len<17){draw();return}let power=clamp(len/125,0,1),speed=150+power*1425;loaded.vx=dx/len*speed;loaded.vy=dy/len*speed;balls.push(loaded);loaded=null;waiting=0;sound('shoot');updateHUD()}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',()=>{aim=null;$('power').classList.add('hidden');draw()});$('pause').onclick=pause;document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});$('start').onclick=()=>{audioReady();start()};$('how').onclick=()=>{modal('<h2>🌟 あそびかた 🌟</h2><div class="rule"><div class="art">↙🪐↗</div><div><b>① ひっぱって、はなそう！</b><small>惑星をひっぱって、ねらいを決めよう。指をはなすと発射！</small></div></div><div class="rule"><div class="art">🪐✨🪐</div><div><b>② おなじ惑星をくっつけよう！</b><small>同じ惑星がぶつかると合体！ ひとつ上の惑星に進化するよ。</small></div></div><div class="rule"><div class="art">☀️💥☀️</div><div><b>③ 太陽をつくろう！</b><small>合体をくり返して太陽をめざそう！ 太陽どうしで「NOVA」発動！</small></div></div><div class="rule"><div class="art">🕳️⚡</div><div><b>④ ブラックホールに注意！</b><small>たまに出るブラックホールも発射！ 惑星に当たると両方消えて、点数が減るよ。</small></div></div><div class="rule"><div class="art">🏆✨</div><div><b>⑤ ハイスコアをめざそう！</b><small>盤面の惑星などが20個になるとゲームオーバー。うまく合体させよう！</small></div></div><button id="close">戻る</button>');$('close').onclick=()=>$('modal').classList.add('hidden')};$('sound').onclick=()=>{modal(`<h2>サウンド設定 ♪</h2><label class="check">効果音 <input id="effects" type="checkbox" ${sfx?'checked':''}></label><p>iPhoneの音量・消音設定も確認してね。</p><button id="close">戻る</button>`);$('effects').onchange=e=>{sfx=e.target.checked;if(sfx){audioReady();sound('merge',3)}};$('close').onclick=()=>$('modal').classList.add('hidden')};fit();})();
</script></body></html>
