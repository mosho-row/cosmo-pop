<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>カーリング・マージ</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#06111e;color:white;font-family:system-ui,sans-serif;touch-action:none}#root{position:relative;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#19364a,#06101b 75%)}canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;background:#05111dd9;display:flex;align-items:center;justify-content:center;padding:20px}.panel{width:min(370px,100%);padding:24px;border:1px solid #42d9f9;border-radius:22px;background:#10283a;display:grid;gap:15px;max-height:92%;overflow:auto;text-align:center}h1{font-size:35px;text-shadow:0 0 18px #42d9f9;margin:12px 0}h2{margin:0}button{border:1px solid #3fe3fa;background:#133e55;color:white;padding:13px;border-radius:13px;font-weight:700;font-size:16px}button:active{background:#23708b}.hidden{display:none!important}#hud{position:absolute;top:max(8px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-size:13px}#hud button{pointer-events:auto;font-size:12px;padding:8px}#score{font-size:25px;font-weight:800}#count{color:#60edff}#choices{position:absolute;bottom:max(15px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:12px;padding:8px 13px;background:#071b2de8;border:1px solid #3ccfe8;border-radius:18px}#choices button{width:70px;height:70px;padding:0;background:transparent;border:0;font-size:43px;text-shadow:0 0 14px #9ff}#help{position:absolute;bottom:108px;width:100%;text-align:center;font-size:12px;color:#d1edf5;pointer-events:none}.rule{display:flex;gap:12px;align-items:center;text-align:left;font-size:13px;line-height:1.6}.rule b{display:block}.diagram{min-width:78px;text-align:center;padding:9px 4px;border:1px solid #4a8496;border-radius:10px;font-size:18px;color:#77f5ff}#flash{position:absolute;top:37%;width:100%;text-align:center;font-size:27px;font-weight:900;color:#ffdb78;pointer-events:none;text-shadow:0 0 14px #ff7}
</style><div id="root"><canvas id="board"></canvas><div id="hud" class="hidden"><div>SCORE<br><span id="score">0</span><br><span id="count">ボール数 0 / 20</span></div><button id="pause">Ⅱ 一時停止</button></div><div id="choices" class="hidden"></div><div id="help" class="hidden"></div><div id="flash"></div><div id="title" class="overlay"><div class="panel"><div style="color:#a4d4e3;font-size:12px">NEON MERGE PUZZLE</div><h1>カーリング・<br>マージ</h1><p>引いて狙って、同じボールを合成！</p><button id="start">ゲームスタート</button><button id="how">遊び方</button><button id="sound">サウンド設定</button></div></div><div id="modal" class="overlay hidden"><div class="panel" id="modalBody"></div></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('board'),c=canvas.getContext('2d');let W,H,D=1,balls=[],choices=[],loaded=null,aim=null,drag=false,score=0,best=0,state='title',last=0,opening=0,particles=[],sfx=true,bgm=true,ac=null,nextId=1,settleTime=0;const palette=['#738ba8','#2679d9','#2dd9f2','#2edca4','#a7e949','#ffdf4b','#ff9b3e','#fa65aa','#b297ff','#fff5c6'];const points=[0,0,100,200,400,700,1100,1700,2500,3600,5000];try{best=Number(localStorage.getItem('curling-merge-best')||0)}catch(e){}function fit(){W=canvas.clientWidth;H=canvas.clientHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;c.setTransform(D,0,0,D,0,0)}addEventListener('resize',fit);fit();const field=()=>({top:H*.16,bottom:H*.79,topWidth:W*.56,bottomWidth:W*.92});const wall=y=>{let f=field(),t=Math.max(0,Math.min(1,(y-f.top)/(f.bottom-f.top)));return [W/2-(f.topWidth+(f.bottomWidth-f.topWidth)*t)/2,W/2+(f.topWidth+(f.bottomWidth-f.topWidth)*t)/2]};const radius=l=>(10+l*1.95)*Math.min(1,W/375);const random=()=>1+Math.floor(Math.random()*3);function tone(kind){if(!sfx)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume();let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime,f={shot:470,wall:220,hit:290,merge:670,exit:170,special:1050}[kind];o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.65,t+.10);g.gain.setValueAtTime(.026,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.13)}catch(e){}}function orb(x,y,r,l){let grad=c.createRadialGradient(x-r*.35,y-r*.4,1,x,y,r*1.1);grad.addColorStop(0,'white');grad.addColorStop(.16,palette[l-1]);grad.addColorStop(.65,palette[l-1]);grad.addColorStop(1,'#061522');c.fillStyle=grad;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.save();c.beginPath();c.arc(x,y,r*.9,0,7);c.clip();c.strokeStyle=l>=9?'#fff9':'#dfffffaa';c.lineWidth=l%2?1.2:2;let n=l%2?2:4;for(let i=0;i<n;i++){let off=(i-(n-1)/2)*r*.34;c.beginPath();if(l<=2){c.moveTo(x+off,y-r);c.lineTo(x+off,y+r)}else if(l<=4){c.moveTo(x-r,y+off);c.lineTo(x+r,y+off)}else if(l<=6){for(let z=-r;z<=r;z+=2){let xx=x+off+Math.sin(z*.25)*r*.1;if(z===-r)c.moveTo(xx,y+z);else c.lineTo(xx,y+z)}}else if(l<=8){for(let z=-r;z<=r;z+=2){let yy=y+off+Math.sin(z*.25)*r*.1;if(z===-r)c.moveTo(x+z,yy);else c.lineTo(x+z,yy)}}else{c.moveTo(x+off,y-r);c.lineTo(x+off,y+r);c.moveTo(x-r,y+off);c.lineTo(x+r,y+off)}c.stroke()}if(l===10){for(let i=0;i<6;i++){c.save();c.translate(x,y);c.rotate(i*Math.PI/6);c.strokeStyle=['#f7a','#7ff','#ff7'][i%3];c.beginPath();c.ellipse(0,0,r*.85,r*.35,0,0,7);c.stroke();c.restore()}}c.restore();c.fillStyle='#ffffffa8';c.beginPath();c.ellipse(x-r*.33,y-r*.43,r*.19,r*.1,-.5,0,7);c.fill()}
function draw(){c.clearRect(0,0,W,H);let f=field(),a=wall(f.top),b=wall(f.bottom);c.beginPath();c.moveTo(a[0],f.top);c.lineTo(a[1],f.top);c.lineTo(b[1],f.bottom);c.lineTo(b[0],f.bottom);c.closePath();let gr=c.createLinearGradient(0,f.top,0,f.bottom);gr.addColorStop(0,'#173247');gr.addColorStop(1,'#0b2031');c.fillStyle=gr;c.fill();c.save();c.clip();c.strokeStyle='#4fb5d022';for(let i=1;i<12;i++){let y=f.top+(f.bottom-f.top)*i/12,z=wall(y);c.beginPath();c.moveTo(z[0],y);c.lineTo(z[1],y);c.stroke()}for(let i=-6;i<=6;i++){c.beginPath();c.moveTo(W/2+i*11,f.top);c.lineTo(W/2+i*35,f.bottom);c.stroke()}c.restore();c.strokeStyle='#42eaff';c.shadowColor='#1cdfff';c.shadowBlur=12;c.lineWidth=3;c.beginPath();c.moveTo(b[0],f.bottom);c.lineTo(a[0],f.top);c.lineTo(a[1],f.top);c.lineTo(b[1],f.bottom);c.stroke();let gap=W*.15,ex=opening;c.beginPath();c.moveTo(b[0],f.bottom);c.lineTo(ex-gap/2,f.bottom);c.moveTo(ex+gap/2,f.bottom);c.lineTo(b[1],f.bottom);c.stroke();c.shadowBlur=0;c.fillStyle='#52faff66';c.fillRect(ex-gap/2,f.bottom-2,gap,4);for(let ball of balls)orb(ball.x,ball.y,radius(ball.l),ball.l);if(loaded){orb(loaded.x,loaded.y,radius(loaded.l),loaded.l);if(aim){c.strokeStyle='#70faff';c.shadowColor='#25eaff';c.shadowBlur=9;c.lineWidth=1.5;c.beginPath();c.moveTo(loaded.x,loaded.y);c.lineTo(loaded.x+aim.x*175,loaded.y+aim.y*175);c.stroke();c.shadowBlur=0}}for(let p of particles){c.globalAlpha=Math.max(0,p.life/.5);c.strokeStyle=p.special?'#ffe67c':'#9cffff';c.lineWidth=2;c.beginPath();c.arc(p.x,p.y,(1-p.life/.5)*p.r+4,0,7);c.stroke()}c.globalAlpha=1}
function hud(){$('score').textContent=score.toLocaleString('ja-JP');$('count').textContent=`ボール数 ${balls.length} / 20`}function showChoices(){choices=[random(),random(),random()];let el=$('choices');el.innerHTML='';choices.forEach((l,i)=>{let btn=document.createElement('button');btn.textContent=['🔵','🔷','🟢'][l-1];btn.style.filter=`drop-shadow(0 0 7px ${palette[l-1]})`;btn.setAttribute('aria-label',`候補${i+1} レベル${l}`);btn.onclick=()=>select(i);el.appendChild(btn)});el.classList.remove('hidden');$('help').classList.remove('hidden');$('help').textContent='3つからボールを選ぼう'}function select(i){if(state!=='playing'||loaded||moving())return;loaded={x:W/2,y:field().bottom+Math.max(32,H*.05),l:choices[i]};$('choices').classList.add('hidden');$('help').textContent='発射台のボールを後ろに引いて狙おう';aim=null;draw()}function moving(){return balls.some(b=>Math.hypot(b.vx,b.vy)>4)}function start(){balls=[];particles=[];score=0;loaded=null;aim=null;drag=false;state='playing';opening=W*(Math.random()<.5?.21+Math.random()*.08:.71+Math.random()*.08);$('title').classList.add('hidden');$('modal').classList.add('hidden');$('hud').classList.remove('hidden');showChoices();hud();draw()}function pointer(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.addEventListener('pointerdown',e=>{if(state!=='playing'||!loaded)return;let p=pointer(e);if(Math.hypot(p.x-loaded.x,p.y-loaded.y)>Math.max(55,radius(loaded.l)*3))return;drag=true;canvas.setPointerCapture(e.pointerId);updateAim(p)});function updateAim(p){if(!loaded)return;let dx=loaded.x-p.x,dy=loaded.y-p.y,dist=Math.hypot(dx,dy);if(dist<1){aim=null;return}aim={x:dx/dist,y:dy/dist,power:Math.min(1,dist/130)};draw()}canvas.addEventListener('pointermove',e=>{if(drag)updateAim(pointer(e))});canvas.addEventListener('pointerup',e=>{if(!drag||!loaded)return;drag=false;if(!aim||aim.power<.05){aim=null;draw();return}let speed=130+aim.power*650;balls.push({id:nextId++,x:loaded.x,y:loaded.y,l:loaded.l,vx:aim.x*speed,vy:aim.y*speed});loaded=null;aim=null;$('help').classList.add('hidden');tone('shot');last=performance.now();requestAnimationFrame(loop)});canvas.addEventListener('pointercancel',()=>{drag=false;aim=null;draw()});
function step(dt){let f=field();for(let b of balls){b.x+=b.vx*dt;b.y+=b.vy*dt;let damping=Math.exp(-(.92+b.l*.015)*dt);b.vx*=damping;b.vy*=damping;if(Math.hypot(b.vx,b.vy)<4)b.vx=b.vy=0;let r=radius(b.l),side=wall(Math.min(f.bottom,Math.max(f.top,b.y)));if(b.y-r<f.top){b.y=f.top+r;b.vy=Math.abs(b.vy)*.67;tone('wall')}if(b.y+r>f.bottom){if(Math.abs(b.x-opening)<W*.075-r*.15&&b.vy>0){b.exit=true}else{b.y=f.bottom-r;b.vy=-Math.abs(b.vy)*.67;tone('wall')}}if(b.x-r<side[0]){b.x=side[0]+r;b.vx=Math.abs(b.vx)*.67;tone('wall')}if(b.x+r>side[1]){b.x=side[1]-r;b.vx=-Math.abs(b.vx)*.67;tone('wall')}}for(let i=balls.length-1;i>=0;i--)if(balls[i].exit){let b=balls.splice(i,1)[0];score-=b.l*100;flash(`−${b.l*100}`);tone('exit')}for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){let a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.001,min=radius(a.l)+radius(b.l);if(dist<min){if(a.l===b.l){merge(i,j);i=-1;break}let nx=dx/dist,ny=dy/dist,overlap=min-dist;a.x-=nx*overlap/2;a.y-=ny*overlap/2;b.x+=nx*overlap/2;b.y+=ny*overlap/2;let rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){let m1=1+a.l*.1,m2=1+b.l*.1,impulse=-(1+.55)*rel/(1/m1+1/m2);a.vx-=impulse*nx/m1;a.vy-=impulse*ny/m1;b.vx+=impulse*nx/m2;b.vy+=impulse*ny/m2;if(rel< -70)tone('hit')}}}for(let p of particles)p.life-=dt;particles=particles.filter(p=>p.life>0);hud()}
function merge(i,j){let a=balls[i],b=balls[j],x=(a.x+b.x)/2,y=(a.y+b.y)/2,l=a.l,vx=(a.vx+b.vx)*.24,vy=(a.vy+b.vy)*.24;balls.splice(j,1);balls.splice(i,1);if(l===10){score+=20000;particles.push({x,y,r:100,life:.5,special:true});flash('+20,000');tone('special')}else{balls.push({id:nextId++,x,y,l:l+1,vx,vy});score+=points[l+1];particles.push({x,y,r:radius(l+1)*2,life:.5});tone('merge')}}function flash(t){$('flash').textContent=t;setTimeout(()=>{if($('flash').textContent===t)$('flash').textContent=''},750)}function loop(t){if(state!=='playing')return;let dt=Math.min(.025,(t-last)/1000||.016);last=t;for(let i=0;i<2;i++)step(dt/2);draw();if(moving()){settleTime=0;requestAnimationFrame(loop)}else if(settleTime<.15){settleTime+=dt;requestAnimationFrame(loop)}else{balls.forEach(b=>{b.vx=0;b.vy=0});if(balls.length>=21){gameover()}else{showChoices();draw()}}}
function gameover(){state='over';$('hud').classList.add('hidden');$('choices').classList.add('hidden');$('help').classList.add('hidden');let record=score>best;if(record){best=score;try{localStorage.setItem('curling-merge-best',String(best))}catch(e){}}modal(`<h2>ゲームオーバー</h2>${record?'<b style="color:#71faff">自己ベスト更新！</b>':''}<div>最終スコア</div><strong style="font-size:34px">${score.toLocaleString('ja-JP')}</strong><div>自己ベスト ${best.toLocaleString('ja-JP')}</div><button id="again">もう一度プレイする</button><button id="back">タイトルへ戻る</button>`);$('again').onclick=start;$('back').onclick=title}function modal(html){$('modalBody').innerHTML=html;$('modal').classList.remove('hidden')}function title(){state='title';loaded=null;$('title').classList.remove('hidden');$('modal').classList.add('hidden');$('hud').classList.add('hidden');$('choices').classList.add('hidden');$('help').classList.add('hidden');draw()}function resume(){state='playing';$('modal').classList.add('hidden');last=performance.now();if(moving())requestAnimationFrame(loop);else draw()}function pause(){if(state!=='playing')return;state='paused';modal('<h2>一時停止</h2><button id="resume">ゲームを続ける</button><button id="leave">タイトルへ戻る</button>');$('resume').onclick=resume;$('leave').onclick=()=>{modal('<h2>タイトルへ戻りますか？</h2><button id="keep">ゲームを続ける</button><button id="yes">タイトルへ戻る</button>');$('keep').onclick=resume;$('yes').onclick=title}}$('pause').onclick=pause;document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});$('start').onclick=start;$('how').onclick=()=>{modal('<h2>遊び方</h2><div class="rule"><div class="diagram">● ● ●</div><div><b>① 3つから選ぶ</b>好きなボールをタップ。</div></div><div class="rule"><div class="diagram">↙ ● ↗</div><div><b>② 引いて発射</b>発射台のボールを後ろに引いて左右に狙いを調整。離すと発射！</div></div><div class="rule"><div class="diagram">●＋●＝◉</div><div><b>③ 同じレベルを合成</b>合成すると得点が入る。</div></div><div class="rule"><div class="diagram">↘ −100</div><div><b>④ 出口に注意</b>出口から落ちるとレベル×100点減点。</div></div><div class="rule"><div class="diagram">10＋10</div><div><b>⑤ 特別合成</b>レベル10同士は両方消えて＋20,000点！</div></div><p style="font-size:13px">動きと合成が終わったとき、21個以上ならゲームオーバー。</p><button id="close">戻る</button>');$('close').onclick=()=>$('modal').classList.add('hidden')};$('sound').onclick=()=>{modal(`<h2>サウンド設定</h2><label>BGM（試作版では未実装） <input id="music" type="checkbox" ${bgm?'checked':''}></label><label>効果音 <input id="effects" type="checkbox" ${sfx?'checked':''}></label><button id="close">戻る</button>`);$('music').onchange=e=>bgm=e.target.checked;$('effects').onchange=e=>sfx=e.target.checked;$('close').onclick=()=>$('modal').classList.add('hidden')};draw();})();
</script></html>
