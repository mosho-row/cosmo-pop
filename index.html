 for(let si=0;si<105;si++){const sx=((si*73+19)%997)/997*W,sy=f.top+((si*137+31)%991)/991*(f.bottom-f.top),sr=si%13===0?1.5:.55+(si%4)*.22;c.beginPath();c.fillStyle=si%7===0?'#d7fbff':'#ffffffaa';c.shadowColor='#7eeeff';c.shadowBlur=si%13===0?5:0;c.arc(sx,sy,sr,0,Math.PI*2);c.fill()}c.shadowBlur=0;c.restore();c.save();c.clip();c.strokeStyle='#4fb5d022';for(let i=1;i<12;i++){let y=f.top+(f.bottom-f.top)*i/12,z=wall(y);c.beginPath();c.moveTo(z[0],y);c.lineTo(z[1],y);c.stroke()}for(let i=-6;i<=6;i++){c.beginPath();c.moveTo(W/2+i*11,f.top);c.lineTo(W/2+i*35,f.bottom);c.stroke()}c.restore();c.strokeStyle='#42eaff';c.shadowColor='#1cdfff';c.shadowBlur=12;c.lineWidth=3;c.beginPath();c.moveTo(b[0],f.bottom);c.lineTo(a[0],f.top);c.lineTo(a[1],f.top);c.lineTo(b[1],f.bottom);c.stroke();c.beginPath();c.moveTo(b[0],f.bottom);c.lineTo(b[1],f.bottom);c.stroke();c.shadowBlur=0;for(let ball of balls)orb(ball.x,ball.y,radius(ball.bh?4:ball.l,!!ball.bh),ball.l,!!ball.bh);if(loaded){orb(loaded.x,loaded.y,radius(loaded.bh?4:loaded.l,!!loaded.bh),loaded.l,!!loaded.bh);if(aim){c.strokeStyle='#70faff';c.shadowColor='#25eaff';c.shadowBlur=9;c.lineWidth=1.5;c.beginPath();c.moveTo(loaded.x,loaded.y);c.lineTo(loaded.x+aim.x*175,loaded.y+aim.y*175);c.stroke();c.shadowBlur=0;let bw=Math.min(150,W*.42),bh=8,bx=W/2-bw/2,by=Math.max(H*.08,loaded.y-radius(loaded.l,!!loaded.bh)-27);c.fillStyle='#06101b';c.fillRect(bx,by,bw,bh);let mg=c.createLinearGradient(bx,0,bx+bw,0);mg.addColorStop(0,'#35f7ff');mg.addColorStop(.6,'#b7ff48');mg.addColorStop(1,'#ff4bd8');c.fillStyle=mg;c.fillRect(bx,by,bw*aim.power,bh);c.strokeStyle='#dffcff';c.lineWidth=1;c.strokeRect(bx,by,bw,bh);c.fillStyle='#ffffff';c.font='bold 11px system-ui';c.textAlign='center';c.fillText(`POWER ${Math.round(aim.power*100)}%`,W/2,by-5)}}for(let p of particles){let alpha=Math.max(0,p.life/(p.maxLife||1));c.globalAlpha=alpha;if(p.spark){c.fillStyle=p.color||['#fff8b0','#ff8c38','#64faff','#ff4bd8'][Math.floor((p.x+p.y)%4+4)%4];c.shadowColor=p function hud(){$('score').textContent=score.toLocaleString('ja-JP');$('count').textContent=`ボール数 ${balls.length} / 20`}function showChoices(){const bh=Math.random()<blackHoleChance;loaded={x:W/2,y:field().bottom+Math.max(32,H*.05),l:bh?1:random(),bh};$('choices').classList.add('hidden');$('help').classList.remove('hidden');$('help').textContent=bh?'ブラックホール！惑星に当たると吸収＆減点！':`レベル${loaded.l}「${planetNames[loaded.l-1]}」を引いて発射！`;aim=null;draw()}function select(i){}function moving(){return balls.some(b=>Math.hypot(b.vx,b.vy)>4)}function start(){$('recordEffect').classList.add('hidden');balls=[];particles=[];popups=[];score=0;blackHoleChance=.03;novaCount=0;bgStage=0;bgPrevStage=0;bgTransitionStart=0;loaded=null;aim=null;drag=false;state='playing';$('title').classList.add('hidden');$('modal').classList.add('hidden');$('hud').classList.remove('hidden');showChoices();hud();draw()}function pointer(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.addEventListener('pointerdown',e=>{if(state!=='playing'||!loaded)return;let p=pointer(e);if(Math.hypot(p.x-loaded.x,p.y-loaded.y)>Math.max(55,radius(loaded.l)*3))return;drag=true;canvas.setPointerCapture(e.pointerId);updateAim(p)});function updateAim(p){if(!loaded)return;let dx=loaded.x-p.x,dy=loaded.y-p.y,dist=Math.hypot(dx,dy);if(dist<1){aim=null;return}aim={x:dx/dist,y:dy/dist,power:Math.min(1,dist/130)};draw()}canvas.addEventListener('pointermove',e=>{if(drag)updateAim(pointer(e))});canvas.addEventListener('pointerup',e=>{if(!drag||!loaded)return;drag=false;if(!aim||aim.power<.05){aim=null;draw();return}let speed=150+aim.power*1050;balls.push({id:nextId++,x:loaded.x,y:loaded.y,l:loaded.l,bh:!!loaded.bh,vx:aim.x*speed,vy:aim.y*speed});loaded=null;aim=null;$('help').classList.add('hidden');tone('shot');last=performance.now();requestAnimationFrame(loop)});canvas.addEventListener('pointercancel',()=>{drag=false;aim=null;draw()});
function step(dt){let f=field();for(let b of balls){b.x+=b.vx*dt;b.y+=b.vy*dt;let damping=Math.exp(-(1.75+b.l*.035)*dt);b.vx*=damping;b.vy*=damping;if(Math.hypot(b.vx,b.vy)<4)b.vx=b.vy=0;let r=radius(b.bh?4:b.l,!!b.bh),side=wall(Math.min(f.bottom,Math.max(f.top,b.y)));if(b.y-r<f.top){b.y=f.top+r;b.vy=Math.abs(b.vy)*.67;}if(b.y+r>f.bottom){b.y=f.bottom-r;b.vy=-Math.abs(b.vy)*.58;}if(b.x-r<side[0]){b.x=side[0]+r;b.vx=Math.abs(b.vx)*.58;}if(b.x+r>side[1]){b.x=side[1]-r;b.vx=-Math.abs(b.vx)*.58;}}for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){let a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.001,min=radius(a.bh?4:a.l,!!a.bh)+radius(b.bh?4:b.l,!!b.bh);if(a.bh&&b.bh&&dist<min+6){mergeBlackHoles(i,j);i=-1;break}if(dist<min){if(!!a.bh!==!!b.bh){absorb(i,j);i=-1;break}if(!a.bh&&!b.bh&&a.l===b.l){merge(i,j);i=-1;break}let nx=dx/dist,ny=dy/dist,overlap=min-dist;a.x-=nx*overlap/2;a.y-=ny*overlap/2;b.x+=nx*overlap/2;b.y+=ny*overlap/2;let rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){let m1=1+a.l*.1,m2=1+b.l*.1,impulse=-(1+.55)*rel/(1/m1+1/m2);a.vx-=impulse*nx/m1;a.vy-=impulse*ny/m1;b.vx+=impulse*nx/m2;b.vy+=impulse*ny/m2;if(rel< -70)tone('hit')}}}for(let p of particles){p.life-=dt;if(p.spark){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.exp(-1.1*dt);p.vy+=25*dt;p.vy*=Math.exp(-1.1*dt)}}particles=particles.filter(p=>p.life>0);for(let q of popups)q.life-=dt;popups=popups.filter(q=>q.life>0);hud()}
function merge(i,j){let a=balls[i],b=balls[j],x=(a.x+b.x)/2,y=(a.y+b.y)/2,l=a.l,vx=(a.vx+b.vx)*.24,vy=(a.vy+b.vy)*.24;balls.splice(j,1);balls.splice(i,1);const resultLevel=Math.min(9,l+1),name=planetNames[resultLevel-1],col=palette[resultLevel-1]||'#fff4a3';popups.push({x,y:y-radius(resultLevel)*.55,text:l===9?'✦ SUPER NOVA! ✦':name+'！',size:l===9?Math.min(26,W/15):Math.min(30,18+resultLevel*1.35),color:l===9?'#ffd96a':col,life:l===9?3:.9,maxLife:l===9?3:.9,nova:l===9});const count=Math.min(30,5+resultLevel*3);for(let k=0;k<count;k++){let ang=Math.random()*Math.PI*2,sp=55+Math.random()*(85+resultLevel*19),life=.45+Math.random()*.3+resultLevel*.025;particles.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-20,r:1.5+Math.random()*(1+resultLevel*.23),life,maxLife:life,spark:true,star:true,color:[col,'#ffffff','#fff8b0','#64faff','#ff4bd8'][k%5],special:resultLevel>=6})}particles.push({x,y,r:radius(resultLevel)*(1.8+resultLevel*.08),life:.5,maxLife:.5,special:resultLevel>=6});if(l===9){score+=20000;novaCount++;bgPrevStage=bgStage;bgStage=(bgStage+1)%stageColors.length;bgTransitionStart=performance.now();blackHoleChance=Math.min(.20,.03+.01*novaCount);for(let k=0;k<85;k++){let ang=Math.random()*Math.PI*2,sp=75+Math.random()*310,life=1.8+Math.random()*1.2;particles.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:2+Math.random()*5,life,maxLife:life,spark:true,star:true,special:true,color:['#fff9b0','#ff8c38','#ffdb48','#ff4b36'][k%4]})}popups.push({x,y:y+radius(9)*.7,text:'+20,000',size:Math.min(27,W/13),color:'#fff1a0',life:3,maxLife:3,nova:true});tone('special',9)}else{balls.push({id:nextId++,x,y,l:l+1,vx,vy});score+=points[l+1];tone('merge',l+1)}}
function mergeBlackHoles(i,j){const a=balls[i],b=balls[j],x=(a.x+b.x)/2,y=(a.y+b.y)/2,level=Math.min(5,(a.l||1)+(b.l||1));balls.splice(j,1);balls.splice(i,1);if(level>=5){const count=balls.length;for(const p of balls){for(let k=0;k<5;k++){const ang=Math.random()*Math.PI*2,sp=40+Math.random()*170;particles.push({x:p.x,y:p.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:2+Math.random()*3,life:.5+Math.random()*.45,maxLife:.95,spark:true,star:true,special:true,color:['#fff9b0','#a78bfa','#64faff','#ff4bd8'][k%4]})}}balls=[];score+=10000;popups.push({x:W/2,y:H*.42,text:'COSMIC RESET!',size:Math.min(30,W/12),color:'#bda5ff',life:3,maxLife:3,nova:true});popups.push({x:W/2,y:H*.49,text:'+10,000',size:Math.min(28,W/13),color:'#fff1a0',life:3,maxLife:3,nova:true});tone('special',5);return}balls.push({id:nextId++,x,y,l:level,bh:true,vx:(a.vx+b.vx)*.12,vy:(a.vy+b.vy)*.12});popups.push({x,y,text:'BLACK HOLE Lv.'+level,size:Math.min(22,W/16),color:'#bda5ff',life:1.2,maxLife:1.2});tone('blackhole',level)}
function absorb(i,j){const a=balls[i],b=balls[j],black=a.bh?a:b,planet=a.bh?b:a;const multipliers=[0,3,5,8,12,16],multiplier=multipliers[Math.min(5,black.l||1)],penalty=points[Math.min(9,planet.l+1)]*multiplier;score-=penalty;const x=(a.x+b.x)/2,y=(a.y+b.y)/2;balls.splice(j,1);balls.splice(i,1);for(let k=0;k<18;k++){const ang=Math.random()*Math.PI*2,sp=35+Math.random()*150;particles.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:2+Math.random()*3,life:.35+Math.random()*.3,spark:true,special:true})}flash(`BLACK HOLE Lv.${black.l||1} −${penalty.toLocaleString('ja-JP')}`);tone('blackhole')}
function flash(t){$('flash').textContent=t;setTimeout(()=>{if($('flash').textContent===t)$('flash').textContent=''},750)}function loop(t){if(state!=='playing')return;let dt=Math.min(.025,(t-last)/1000||.016);last=t;for(let i=0;i<2;i++)step(dt/2);draw();if(moving()){settleTime=0;requestAnimationFrame(loop)}else if(settleTime<.15){settleTime+=dt;requestAnimationFrame(loop)}else{balls.forEach(b=>{b.vx=0;b.vy=0});if(particles.length||popups.length){requestAnimationFrame(loop)}else if(balls.length>=20){gameover()}else{showChoices();draw()}}}
function gameover(){state='over';$('hud').classList.add('hidden');$('choices').classList.add('hidden');$('help').classList.add('hidden');let record=score>best;if(record){best=score;try{localStorage.setItem('curling-merge-best',String(best))}catch(e){}$('titleBest').textContent='🏆 BEST SCORE　'+best.toLocaleString('ja-JP');$('recordEffect').classList.remove('hidden');setTimeout(()=>$('recordEffect').classList.add('hidden'),2600)}modal(`<h2>ゲームオーバー</h2>${record?'<b class="new-record" style="display:inline-block">✦ NEW RECORD! ✦</b>':''}<div>最終スコア</div><strong style="font-size:34px">${score.toLocaleString('ja-JP')}</strong><button id="again">もう一度プレイする</button><button id="back">タイトルへ戻る</button>`);$('again').onclick=start;$('back').onclick=title}function modal(html){$('modalBody').innerHTML=html;$('modal').classList.remove('hidden')}function title(){state='title';$('titleBest').textContent='🏆 BEST SCORE　'+best.toLocaleString('ja-JP');$('recordEffect').classList.add('hidden');loaded=null;$('title').classList.remove('hidden');$('modal').classList.add('hidden');$('hud').classList.add('hidden');$('choices').classList.add('hidden');$('help').classList.add('hidden');draw()}function resume(){state='playing';$('modal').classList.add('hidden');last=performance.now();if(moving())requestAnimationFrame(loop);else draw()}function pause(){if(state!=='playing')return;state='paused';const pauseMenu=()=>{modal('<h2>一時停止</h2><button id="resume">ゲームを続ける</button><button id="leave">タイトルに戻る</button>');$('resume').onclick=resume;$('leave').onclick=()=>{modal('<h2>本当にいい？</h2><button id="cancelLeave">キャンセル</button><button id="yes">タイトルに戻る</button>');$('cancelLeave').onclick=pauseMenu;$('yes').onclick=title}};pauseMenu()}$('pause').onclick=pause;document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});$('start').onclick=start;$('how').onclick=()=>{modal('<h2>遊び方</h2><div class="help-short"><div><strong>↗ 引っ張って発射</strong><span>惑星を引いて狙い、指を離して発射。壁の反射も使おう！</span></div><div><stron
