<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>カーリング・マージ</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#06111e;color:white;font-family:system-ui,sans-serif;touch-action:none}#root{position:relative;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#18324c,#050b17 80%)}canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;background:#05111de8;display:flex;align-items:center;justify-content:center;padding:20px}.panel{width:min(370px,100%);padding:23px;border:1px solid #42d9f9;border-radius:22px;background:#10283a;display:grid;gap:14px;max-height:90%;overflow:auto;text-align:center}h1{font-size:35px;text-shadow:0 0 18px #42d9f9;margin:10px 0}h2{margin:0}button{border:1px solid #3fe3fa;background:#133e55;color:white;padding:13px;border-radius:13px;font-weight:700;font-size:16px}.hidden{display:none!important}#hud{position:absolute;top:max(8px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-size:13px}#hud button{pointer-events:auto;font-size:12px;padding:8px}#score{font-size:25px;font-weight:800}#count{color:#60edff}#help{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));width:100%;text-align:center;font-size:13px;color:#d1edf5;pointer-events:none}#flash{position:absolute;top:34%;width:100%;text-align:center;font-size:29px;font-weight:900;color:#ffdb78;pointer-events:none;text-shadow:0 0 14px #ff7}.rule{display:flex;gap:10px;text-align:left;align-items:center;font-size:13px;line-height:1.5}.diagram{min-width:72px;text-align:center;padding:9px 4px;border:1px solid #4a8496;border-radius:10px;font-size:19px;color:#77f5ff}
</style></head><body><div id="root"><canvas id="board"></canvas><div id="hud" class="hidden"><div>SCORE<br><span id="score">0</span><br><span id="count">惑星数 0 / 20</span></div><button id="pause">Ⅱ 一時停止</button></div><div id="help" class="hidden">惑星を後ろに引いて発射！</div><div id="flash"></div><div id="title" class="overlay"><div class="panel"><div style="color:#a4d4e3;font-size:12px">PLANET CURLING MERGE</div><h1>カーリング・<br>マージ</h1><p>惑星を飛ばして、同じ惑星を合成！</p><button id="start">ゲームスタート</button><button id="how">遊び方</button><button id="sound">サウンド設定</button></div></div><div id="modal" class="overlay hidden"><div class="panel" id="modalBody"></div></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('board'),c=canvas.getContext('2d');let W=0,H=0,D=1,balls=[],loaded=null,aim=null,drag=false,score=0,best=0,state='title',last=0,opening={side:'left',y:0},particles=[],sfx=true,ac=null,nextId=1,settleTime=0,raf=0,run=0;const names=['水星','金星','地球','火星','木星','土星','天王星','太陽'],colors=['#a8a49c','#dfba75','#268bd5','#d16a41','#cba079','#e0c78a','#7bd2df','#ffb526'],points=[0,0,100,250,500,900,1500,2400,4000];try{best=Number(localStorage.getItem('curling-merge-best')||0)}catch(e){}const rand=()=>1+Math.floor(Math.random()*4);function fit(){W=canvas.clientWidth;H=canvas.clientHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;c.setTransform(D,0,0,D,0,0);if(state==='playing'&&!drag&&!moving()&&loaded){loaded.x=W/2;loaded.y=launchY()}draw()}addEventListener('resize',fit);const field=()=>({top:H*.15,bottom:H*.88,topWidth:W*.77,bottomWidth:W*.91});function wall(y){let f=field(),t=Math.max(0,Math.min(1,(y-f.top)/(f.bottom-f.top))),w=f.topWidth+(f.bottomWidth-f.topWidth)*t;return[W/2-w/2,W/2+w/2]}const radius=l=>(16+l*3.3)*Math.min(1.1,Math.max(.76,W/375));const launchY=()=>H*.57;function audioReady(){if(!sfx)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}function tone(kind){if(!sfx)return;try{audioReady();if(!ac)return;let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime,f={shot:440,wall:180,hit:240,merge:720,exit:150,special:1050}[kind]||300;o.type=kind==='special'?'sawtooth':'sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(60,f*(kind==='special'?.12:.65)),t+(kind==='special'?.48:.13));g.gain.setValueAtTime(kind==='special'?.085:.05,t);g.gain.exponentialRampToValueAtTime(.001,t+(kind==='special'?.5:.15));o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+(kind==='special'?.52:.16))}catch(e){}}function orb(x,y,r,l){c.save();if(l===8){let glow=c.createRadialGradient(x,y,r*.4,x,y,r*1.7);glow.addColorStop(0,'#ffcf5366');glow.addColorStop(1,'#ff8d0000');c.fillStyle=glow;c.beginPath();c.arc(x,y,r*1.7,0,Math.PI*2);c.fill()}let grad=c.createRadialGradient(x-r*.32,y-r*.36,1,x,y,r);grad.addColorStop(0,l===8?'#fff6ab':'#ffffff');grad.addColorStop(.22,colors[l-1]);grad.addColorStop(.72,colors[l-1]);grad.addColorStop(1,l===8?'#e13b09':'#142235');c.fillStyle=grad;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();c.save();c.beginPath();c.arc(x,y,r*.97,0,Math.PI*2);c.clip();if(l===3){c.fillStyle='#2fb66e';for(let i=0;i<5;i++){c.beginPath();c.ellipse(x+Math.sin(i*2.8)*r*.56,y+Math.cos(i*3.1)*r*.55,r*(i%2?.28:.18),r*.19,i,0,7);c.fill()}}else if(l===1||l===4){c.fillStyle=l===1?'#595c65aa':'#8d352a88';for(let i=0;i<7;i++){let px=x+Math.sin(i*2.4)*r*.7,py=y+Math.cos(i*1.9)*r*.7;c.beginPath();c.arc(px,py,r*(.07+i%3*.035),0,7);c.fill()}}else if(l===2||l===5||l===6||l===7){c.strokeStyle=l===7?'#dffaffaa':'#75513d88';c.lineWidth=Math.max(2,r*.15);for(let i=-3;i<=3;i++){c.beginPath();c.moveTo(x-r,y+i*r*.28);c.bezierCurveTo(x-r*.2,y+i*r*.25+r*.1,x+r*.2,y+i*r*.25-r*.1,x+r,y+i*r*.28);c.stroke()}}else{c.strokeStyle='#ffed8aaa';c.lineWidth=3;for(let i=0;i<6;i++){c.beginPath();c.moveTo(x-r,y+(i-3)*r*.32);c.lineTo(x+r,y+(i-3)*r*.32);c.stroke()}}c.restore();if(l===6){c.save();c.translate(x,y);c.rotate(-.27);c.strokeStyle='#dfd2b5';c.lineWidth=Math.max(3,r*.17);c.beginPath();c.ellipse(0,0,r*1.43,r*.42,0,0,7);c.stroke();c.restore()}c.strokeStyle='#ffffff88';c.lineWidth=1.5;c.beginPath();c.arc(x,y,r,0,7);c.stroke();c.restore()}
function draw(){if(!W||!H)return;c.clearRect(0,0,W,H);let f=field(),a=wall(f.top),b=wall(f.bottom);c.beginPath();c.moveTo(a[0],f.top);c.lineTo(a[1],f.top);c.lineTo(b[1],f.bottom);c.lineTo(b[0],f.bottom);c.closePath();let gr=c.createLinearGradient(0,f.top,0,f.bottom);gr.addColorStop(0,'#163047');gr.addColorStop(1,'#091d2d');c.fillStyle=gr;c.fill();c.save();c.clip();c.strokeStyle='#4fb5d02b';for(let i=1;i<13;i++){let y=f.top+(f.bottom-f.top)*i/13,z=wall(y);c.beginPath();c.moveTo(z[0],y);c.lineTo(z[1],y);c.stroke()}for(let i=-7;i<=7;i++){c.beginPath();c.moveTo(W/2+i*12,f.top);c.lineTo(W/2+i*29,f.bottom);c.stroke()}c.restore();c.strokeStyle='#42eaff';c.shadowColor='#1cdfff';c.shadowBlur=10;c.lineWidth=3;const line=(x1,y1,x2,y2)=>{c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()};line(a[0],f.top,a[1],f.top);line(b[0],f.bottom,b[1],f.bottom);let gap=H*.16,lo=opening.y-gap/2,hi=opening.y+gap/2;if(opening.side==='left'){line(a[0],f.top,wall(lo)[0],lo);line(wall(hi)[0],hi,b[0],f.bottom);line(a[1],f.top,b[1],f.bottom)}else{line(a[1],f.top,wall(lo)[1],lo);line(wall(hi)[1],hi,b[1],f.bottom);line(a[0],f.top,b[0],f.bottom)}c.shadowBlur=0;c.strokeStyle='#ffd36e';c.lineWidth=5;line(wall(lo)[opening.side==='left'?0:1],lo,wall(hi)[opening.side==='left'?0:1],hi);for(let ball of balls)orb(ball.x,ball.y,radius(ball.l),ball.l);if(loaded){orb(loaded.x,loaded.y,radius(loaded.l),loaded.l);if(aim){let len=aim.power*185,tx=loaded.x+aim.x*len,ty=loaded.y+aim.y*len;c.strokeStyle='#7bffff';c.lineWidth=3+aim.power*4;c.shadowColor='#1ff';c.shadowBlur=12;line(loaded.x,loaded.y,tx,ty);let angle=Math.atan2(aim.y,aim.x);c.beginPath();c.moveTo(tx,ty);c.lineTo(tx-17*Math.cos(angle-.5),ty-17*Math.sin(angle-.5));c.moveTo(tx,ty);c.lineTo(tx-17*Math.cos(angle+.5),ty-17*Math.sin(angle+.5));c.stroke();c.shadowBlur=0;let gx=W*.18,gy=H*.76,gw=W*.64;c.fillStyle='#173d55';c.fillRect(gx,gy,gw,9);c.fillStyle=aim.power>.7?'#ffb52d':'#49efff';c.fillRect(gx,gy,gw*aim.power,9);c.strokeStyle='#c9ffff';c.lineWidth=1;c.strokeRect(gx,gy,gw,9);c.fillStyle='#d6ffff';c.font='bold 13px system-ui';c.textAlign='center';c.fillText('発射パワー '+Math.round(aim.power*100)+'%',W/2,gy-8)}}for(let p of particles){c.globalAlpha=Math.max(0,p.life/p.max);c.strokeStyle=p.special?'#ffce36':'#a0ffff';c.lineWidth=p.special?5:3;c.beginPath();c.arc(p.x,p.y,(1-p.life/p.max)*p.r+4,0,7);c.stroke();if(p.special){for(let i=0;i<12;i++){let angle=i*Math.PI/6,rr=(1-p.life/p.max)*p.r;c.beginPath();c.moveTo(p.x+Math.cos(angle)*rr*.45,p.y+Math.sin(angle)*rr*.45);c.lineTo(p.x+Math.cos(angle)*rr,p.y+Math.sin(angle)*rr);c.stroke()}}}c.globalAlpha=1}
function hud(){$('score').textContent=score.toLocaleString('ja-JP');$('count').textContent=`惑星数 ${balls.length} / 20`}function moving(){return balls.some(b=>Math.hypot(b.vx,b.vy)>5)}function next(){if(state!=='playing')return;if(balls.length>=20){gameover();return}loaded={x:W/2,y:launchY(),l:rand()};aim=null;drag=false;$('help').classList.remove('hidden');$('help').textContent=`${names[loaded.l-1]}を後ろに引いて発射！`;draw()}function start(){cancelAnimationFrame(raf);run++;balls=[];particles=[];score=0;loaded=null;aim=null;drag=false;settleTime=0;nextId=1;state='playing';let f=field();opening={side:Math.random()<.5?'left':'right',y:f.top+(f.bottom-f.top)*(.30+Math.random()*.42)};$('title').classList.add('hidden');$('modal').classList.add('hidden');$('hud').classList.remove('hidden');hud();audioReady();next()}function pointer(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.addEventListener('pointerdown',e=>{if(state!=='playing'||!loaded)return;audioReady();let p=pointer(e);if(Math.hypot(p.x-loaded.x,p.y-loaded.y)>Math.max(65,radius(loaded.l)*3))return;drag=true;canvas.setPointerCapture(e.pointerId);updateAim(p)});function updateAim(p){if(!loaded)return;let dx=loaded.x-p.x,dy=loaded.y-p.y,dist=Math.hypot(dx,dy);if(dist<2){aim=null;draw();return}aim={x:dx/dist,y:dy/dist,power:Math.min(1,dist/150)};draw()}canvas.addEventListener('pointermove',e=>{if(drag)updateAim(pointer(e))});canvas.addEventListener('pointerup',e=>{if(!drag||!loaded)return;drag=false;if(!aim||aim.power<.05){aim=null;draw();return}let speed=180+aim.power*780;balls.push({id:nextId++,x:loaded.x,y:loaded.y,l:loaded.l,vx:aim.x*speed,vy:aim.y*speed});loaded=null;aim=null;$('help').classList.add('hidden');tone('shot');hud();if(balls.length>=20){gameover();return}last=performance.now();settleTime=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)});canvas.addEventListener('pointercancel',()=>{drag=false;aim=null;draw()});function isGap(y,r,side){return side===opening.side&&y>opening.y-H*.08+r*.25&&y<opening.y+H*.08-r*.25}function step(dt){let f=field();for(let b of balls){b.x+=b.vx*dt;b.y+=b.vy*dt;let damping=Math.exp(-(.36+b.l*.008)*dt);b.vx*=damping;b.vy*=damping;if(Math.hypot(b.vx,b.vy)<5)b.vx=b.vy=0;let r=radius(b.l),side=wall(Math.max(f.top,Math.min(f.bottom,b.y)));if(b.y-r<f.top){b.y=f.top+r;b.vy=Math.abs(b.vy)*.76;if(Math.abs(b.vy)>35)tone('wall')}if(b.y+r>f.bottom){b.y=f.bottom-r;b.vy=-Math.abs(b.vy)*.76;if(Math.abs(b.vy)>35)tone('wall')}if(b.x-r<side[0]){if(isGap(b.y,r,'left')&&b.vx<0){b.exit=true}else{b.x=side[0]+r;b.vx=Math.abs(b.vx)*.76;if(Math.abs(b.vx)>35)tone('wall')}}if(b.x+r>side[1]){if(isGap(b.y,r,'right')&&b.vx>0){b.exit=true}else{b.x=side[1]-r;b.vx=-Math.abs(b.vx)*.76;if(Math.abs(b.vx)>35)tone('wall')}}}for(let i=balls.length-1;i>=0;i--)if(balls[i].exit){let b=balls.splice(i,1)[0];score-=b.l*100;flash('−'+b.l*100);tone('exit')}outer:for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){let a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.001,min=radius(a.l)+radius(b.l);if(dist<min){if(a.l===b.l){merge(i,j);break outer}let nx=dx/dist,ny=dy/dist,overlap=min-dist;a.x-=nx*overlap/2;a.y-=ny*overlap/2;b.x+=nx*overlap/2;b.y+=ny*overlap/2;let rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){let m1=1+a.l*.14,m2=1+b.l*.14,impulse=-(1+.76)*rel/(1/m1+1/m2);a.vx-=impulse*nx/m1;a.vy-=impulse*ny/m1;b.vx+=impulse*nx/m2;b.vy+=impulse*ny/m2;if(rel< -95)tone('hit')}}}for(let p of particles)p.life-=dt;particles=particles.filter(p=>p.life>0);hud()}function merge(i,j){let a=balls[i],b=balls[j],x=(a.x+b.x)/2,y=(a.y+b.y)/2,l=a.l,vx=(a.vx+b.vx)*.25,vy=(a.vy+b.vy)*.25;balls.splice(j,1);balls.splice(i,1);if(l===8){score+=20000;particles.push({x,y,r:Math.max(W,H)*.48,life:1,max:1,special:true});flash('☀️ 太陽爆発！ +20,000');tone('special')}else{balls.push({id:nextId++,x,y,l:l+1,vx,vy});score+=points[l+1];particles.push({x,y,r:radius(l+1)*2.6,life:.5,max:.5,special:false});tone('merge')}}function flash(t){$('flash').textContent=t;let token=run;setTimeout(()=>{if(token===run&&$('flash').textContent===t)$('flash').textContent=''},850)}function loop(t){if(state!=='playing')return;let dt=Math.min(.025,(t-last)/1000||.016);last=t;for(let i=0;i<2;i++)step(dt/2);draw();if(balls.length>=20){gameover();return}if(moving()||particles.length){settleTime=0;raf=requestAnimationFrame(loop)}else if(settleTime<.25){settleTime+=dt;raf=requestAnimationFrame(loop)}else{balls.forEach(b=>{b.vx=0;b.vy=0});next()}}function modal(html){$('modalBody').innerHTML=html;$('modal').classList.remove('hidden')}function gameover(){state='over';cancelAnimationFrame(raf);$('hud').classList.add('hidden');$('help').classList.add('hidden');let record=score>best;if(record){best=score;try{localStorage.setItem('curling-merge-best',String(best))}catch(e){}}modal(`<h2>ゲームオーバー</h2>${record?'<b style="color:#71faff">自己ベスト更新！</b>':''}<div>最終スコア</div><strong style="font-size:34px">${score.toLocaleString('ja-JP')}</strong><div>自己ベスト ${best.toLocaleString('ja-JP')}</div><button id="again">もう一度プレイする</button><button id="back">タイトルへ戻る</button>`);$('again').onclick=start;$('back').onclick=title}function title(){run++;cancelAnimationFrame(raf);state='title';loaded=null;balls=[];$('title').classList.remove('hidden');$('modal').classList.add('hidden');$('hud').classList.add('hidden');$('help').classList.add('hidden');draw()}function resume(){state='playing';$('modal').classList.add('hidden');last=performance.now();if(moving()||particles.length)raf=requestAnimationFrame(loop);else if(!loaded)next();else draw()}function pause(){if(state!=='playing')return;state='paused';cancelAnimationFrame(raf);modal('<h2>一時停止</h2><button id="resume">ゲームを続ける</button><button id="leave">タイトルへ戻る</button>');$('resume').onclick=resume;$('leave').onclick=()=>{modal('<h2>タイトルへ戻りますか？</h2><button id="keep">ゲームを続ける</button><button id="yes">タイトルへ戻る</button>');$('keep').onclick=resume;$('yes').onclick=title}}$('pause').onclick=pause;document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});$('start').onclick=start;$('how').onclick=()=>{modal('<h2>遊び方</h2><div class="rule"><div class="diagram">☿ ♀ 🌍</div><div><b>① ランダム出現</b>レベル1〜4の惑星が毎回1つ出現。</div></div><div class="rule"><div class="diagram">↙ ● ↗</div><div><b>② 引いて発射</b>惑星を後ろに引いて狙おう。矢印とゲージで強さが分かるよ。</div></div><div class="rule"><div class="diagram">●＋●＝◉</div><div><b>③ 同じ惑星を合成</b>合成すると大きくなって得点アップ。</div></div><div class="rule"><div class="diagram">☀＋☀＝💥</div><div><b>④ 太陽の大爆発</b>太陽同士がぶつかると両方消えて＋20,000点！</div></div><div class="rule"><div class="diagram">← −100</div><div><b>⑤ 左右の出口</b>左右どちらか1箇所の穴から落ちると減点。</div></div><p style="font-size:13px">惑星が20個に達するとゲームオーバー。</p><button id="close">戻る</button>');$('close').onclick=()=>$('modal').classList.add('hidden')};$('sound').onclick=()=>{modal(`<h2>サウンド設定</h2><label>効果音 <input id="effects" type="checkbox" ${sfx?'checked':''}></label><p style="font-size:12px">iPhoneの消音設定や音量も確認してね。</p><button id="close">戻る</button>`);$('effects').onchange=e=>{sfx=e.target.checked;if(sfx){audioReady();tone('merge')}};$('close').onclick=()=>$('modal').classList.add('hidden')};fit()})();
</script></body></html>
